# 可选的本地 broker（compose profile "broker"），供 play / dashboard 回放用。
# 宿主机已经跑着 mosquitto 的话不要启用，会抢 1883 端口。
#
# 只监听本机：容器是 host 网络，dashboard / play / record 都通过 127.0.0.1 连，不需要对外。
# 如果被测系统在另一台机器上要订阅回放流，改成 `listener 1883 0.0.0.0` 并同时把
# allow_anonymous 改为 false + 配 password_file，不要把匿名 broker 暴露到局域网。
listener 1883 127.0.0.1
allow_anonymous true
persistence false
log_dest stdout
