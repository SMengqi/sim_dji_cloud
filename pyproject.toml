[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-dji-cloud"
version = "0.1.0"
description = "DJI Dock 3 cloud API recorder & offline simulator"
requires-python = ">=3.10"
dependencies = [
  "gmqtt>=0.6.16",
  "pyyaml>=6.0",
  "click>=8.1",
  "loguru>=0.7",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12.0",
  "pyproj>=3.6",
  "aiohttp>=3.10",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "pytest-mock>=3.11",
  "pytest-timeout>=2.1",
  "httpx>=0.27",
]

[project.scripts]
sim-dji = "sim_dji_cloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
